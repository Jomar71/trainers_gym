<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrainerHub · Tu gimnasio, organizado</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <noscript class="noscript">Esta aplicación necesita JavaScript para funcionar. Actívalo en tu navegador.</noscript>

    <script src="js/data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        (function () {
            var s = GP.auth.current();
            if (s && s.role === 'TRAINER') location.replace('pages/trainer/home.html');
            else if (s && s.role === 'CLIENT') location.replace('pages/client/home.html');
            else location.replace('pages/login.html');
        })();
    </script>
</body>
</html>
