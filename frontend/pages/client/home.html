<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio · Mi Entrenamiento</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="layout-client">
        <header class="client-header">
            <div class="client-header-inner">
                <div>
                    <p class="client-header-brand">TrainerHub</p>
                    <p class="client-header-sub" id="navGoal">Tu objetivo</p>
                </div>
                <div class="client-header-user" id="navUser"></div>
            </div>
        </header>

        <main id="app" class="client-main"></main>

        <nav class="bottom-nav" aria-label="Navegación inferior">
            <button class="active" onclick="GP.client.actions.home()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
                <span>Inicio</span>
            </button>
            <button onclick="GP.client.actions.routines()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5h2v11h-2z"/><path d="M15.5 6.5h2v11h-2z"/><path d="M3 9.5h3.5v5H3z"/><path d="M17.5 9.5H21v5h-3.5z"/></svg>
                <span>Rutinas</span>
            </button>
            <button onclick="GP.client.actions.nutrition()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/></svg>
                <span>Nutrición</span>
            </button>
            <button onclick="GP.client.actions.calendar()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span>Agenda</span>
            </button>
            <button onclick="GP.client.actions.progress()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V10"/><path d="M12 20V4"/><path d="M19 20v-6"/></svg>
                <span>Progreso</span>
            </button>
        </nav>
    </div>

    <noscript class="noscript">Esta aplicación necesita JavaScript para funcionar. Actívalo en tu navegador.</noscript>

    <script src="../../js/data.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/ui.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/client.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        GP.client.home();
    </script>
</body>
</html>
