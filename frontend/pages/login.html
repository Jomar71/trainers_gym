<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión · TrainerHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
    <div class="auth-backdrop"></div>
    <div class="auth-card">
        <div class="auth-brand">TrainerHub</div>
        <h1 class="auth-heading">Iniciar sesión</h1>
        <p class="auth-sub">Accede a tu cuenta para continuar</p>

        <form id="loginForm" novalidate>
            <div class="form-group mb-3">
                <label class="form-label" for="email">Correo electrónico</label>
                <input class="form-input" id="email" type="email" placeholder="tu@correo.com" autocomplete="email" required>
            </div>
            <div class="form-group mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input class="form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <label class="auth-remember">
                <input type="checkbox" id="remember">
                <span>Recordarme</span>
            </label>
            <button type="submit" class="btn btn-primary w-100 mt-3">Entrar</button>
        </form>

        <p class="auth-footer">¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>

        <div class="auth-demo">
            <small>Cuentas de demostración:</small>
            <p>Entrenador → <code>admin@example.com</code> / <code>admin</code></p>
            <p>Cliente → <code>cliente@example.com</code> / <code>cliente123</code></p>
        </div>
    </div>

    <noscript class="noscript">Esta aplicación necesita JavaScript para funcionar. Actívalo en tu navegador.</noscript>

    <script src="../js/data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script>
        (function () {
            var form = document.getElementById('loginForm');
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var email = document.getElementById('email').value.trim();
                var pass = document.getElementById('password').value;
                var remember = document.getElementById('remember').checked;
                if (!email || !pass) { GP.ui.toast('Ingresa tu correo y contraseña', 'error'); return; }
                var user = GP.auth.login(email, pass, remember);
                if (!user) { GP.ui.toast('Credenciales incorrectas. Revisa los datos.', 'error'); return; }
                GP.ui.toast('¡Bienvenido, ' + user.name + '!', 'success');
                setTimeout(function () { location.href = GP.auth.homeURL(); }, 500);
            });
            // Si ya hay sesión activa, redirigir directo
            if (GP.auth.current()) location.replace(GP.auth.homeURL());
        })();
    </script>
</body>
</html>
